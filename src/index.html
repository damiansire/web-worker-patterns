<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mastering Web Workers: patrones de Web Workers en demos interactivas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content-Security-Policy vía meta: el hardening que SÍ llega al deploy real de
      GitHub Pages (que no puede mandar cabeceras HTTP; nginx.conf/Dockerfile sí, para
      self-host). 'unsafe-inline' en style-src es necesario para el CSS crítico que
      Angular inyecta inline; scripts y workers quedan restringidos a 'self'.
      connect-src suma solo el endpoint de GoatCounter (conteo de visitas por sendBeacon,
      ver core/analytics/page-view.logic.ts).
      Nota honesta: meta-CSP NO soporta frame-ancestors ni X-Content-Type-Options
      (nosniff): esos son solo cabeceras HTTP, imposibles en Pages; el path
      nginx/Docker los cubre para self-host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://web-worker-patterns.goatcounter.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />

    <!-- SEO / social. La app es una colección de demos interactivas (en español). -->
