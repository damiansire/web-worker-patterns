<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mastering Web Workers: patrones de Web Workers en demos interactivas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content-Security-Policy vía meta: el hardening que SÍ llega al deploy real de
      GitHub Pages (que no puede mandar cabeceras HTTP; nginx.conf/Dockerfile sí, para
      self-host). 'unsafe-inline' en style-src es necesario para el CSS crítico que
      Angular inyecta inline; scripts y workers quedan restringidos a 'self'.
      Nota honesta: meta-CSP NO soporta frame-ancestors ni X-Content-Type-Options
      (nosniff) — esos son solo cabeceras HTTP, imposibles en Pages; el path
      nginx/Docker los cubre para self-host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- SEO / social. La app es una colección de demos interactivas (en español). -->
    <meta
      name="description"
      content="Demos interactivas de patrones de Web Workers en el navegador: offloading de cómputo, objetos transferibles, SharedArrayBuffer + Atomics, pool de workers, backpressure y degradación elegante."
    />
    <link rel="canonical" href="https://damiansire.github.io/web-worker-patterns/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://damiansire.github.io/web-worker-patterns/" />
    <meta
      property="og:title"
      content="Mastering Web Workers: patrones de Web Workers en demos interactivas"
    />
    <meta
      property="og:description"
      content="Demos interactivas de patrones de Web Workers: offloading, transferables, SharedArrayBuffer, pool, backpressure y degradación elegante."
    />
    <meta name="twitter:card" content="summary" />
    <!--
      Habilita cross-origin isolation en hosts sin cabeceras propias (GitHub Pages)
      para que el ejemplo 12 (SharedArrayBuffer + Atomics) corra en el demo desplegado.
      Se resuelve contra <base href>, así funciona tanto en / (local) como en
      /web-worker-patterns/ (Pages). Ver public/coi-serviceworker.js.
    -->
    <script src="coi-serviceworker.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
